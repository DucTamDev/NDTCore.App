<div style="min-height:480px; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; border-radius:12px; padding:24px;">

  <div style="width:420px; background:var(--surface-2); border-radius:16px; border:0.5px solid var(--border); overflow:hidden;">

    <div style="display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:0.5px solid var(--border);">
      <i class="ti ti-printer" style="font-size:18px; color:var(--text-accent);" aria-hidden="true"></i>
      <span style="font-size:14px; font-weight:500; flex:1;">Thêm máy in</span>
      <i class="ti ti-x" style="font-size:18px; color:var(--text-muted);" aria-hidden="true"></i>
    </div>

    <div style="padding:16px; display:flex; flex-direction:column; gap:14px;">

      <div>
        <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:6px;">Tên máy in</label>
        <input placeholder="Ví dụ: Máy in hóa đơn quầy 2" style="width:100%;" />
      </div>

      <div>
        <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:6px;">Loại máy in</label>
        <div style="display:flex; gap:8px;">
          <div style="flex:1; padding:10px; border:1px solid var(--border-accent); border-radius:var(--radius); background:var(--bg-accent); text-align:center;">
            <i class="ti ti-receipt" style="font-size:18px; color:var(--text-accent);" aria-hidden="true"></i>
            <p style="font-size:12px; margin:4px 0 0; color:var(--text-accent);">Máy in hóa đơn</p>
          </div>
          <div style="flex:1; padding:10px; border:0.5px solid var(--border); border-radius:var(--radius); text-align:center;">
            <i class="ti ti-tag" style="font-size:18px; color:var(--text-secondary);" aria-hidden="true"></i>
            <p style="font-size:12px; margin:4px 0 0; color:var(--text-secondary);">Máy in tem</p>
          </div>
        </div>
      </div>

      <div>
        <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:6px;">Loại kết nối</label>
        <div style="display:flex; gap:8px;">
          <div style="flex:1; padding:8px 4px; border:1px solid var(--border-accent); border-radius:var(--radius); background:var(--bg-accent); text-align:center;">
            <i class="ti ti-usb" style="font-size:16px; color:var(--text-accent);" aria-hidden="true"></i>
            <p style="font-size:11px; margin:4px 0 0; color:var(--text-accent);">USB</p>
          </div>
          <div style="flex:1; padding:8px 4px; border:0.5px solid var(--border); border-radius:var(--radius); text-align:center;">
            <i class="ti ti-bluetooth" style="font-size:16px; color:var(--text-secondary);" aria-hidden="true"></i>
            <p style="font-size:11px; margin:4px 0 0; color:var(--text-secondary);">Bluetooth</p>
          </div>
          <div style="flex:1; padding:8px 4px; border:0.5px solid var(--border); border-radius:var(--radius); text-align:center;">
            <i class="ti ti-wifi" style="font-size:16px; color:var(--text-secondary);" aria-hidden="true"></i>
            <p style="font-size:11px; margin:4px 0 0; color:var(--text-secondary);">LAN</p>
          </div>
        </div>
      </div>

      <div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
          <label style="font-size:12px; color:var(--text-secondary);">Thiết bị tìm thấy</label>
          <span style="font-size:12px; color:var(--text-accent); display:flex; align-items:center; gap:4px;"><i class="ti ti-refresh" style="font-size:13px;" aria-hidden="true"></i>Quét lại</span>
        </div>
        <div style="border:0.5px solid var(--border); border-radius:var(--radius); overflow:hidden;">
          <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:0.5px solid var(--border); background:var(--bg-accent);">
            <i class="ti ti-device-usb" style="font-size:15px; color:var(--text-accent);" aria-hidden="true"></i>
            <span style="font-size:13px; flex:1; color:var(--text-accent);">USB Printer 001</span>
            <i class="ti ti-check" style="font-size:15px; color:var(--text-accent);" aria-hidden="true"></i>
          </div>
          <div style="display:flex; align-items:center; gap:10px; padding:10px 12px;">
            <i class="ti ti-device-usb" style="font-size:15px; color:var(--text-secondary);" aria-hidden="true"></i>
            <span style="font-size:13px; flex:1; color:var(--text-secondary);">EPSON TM-T82</span>
          </div>
        </div>
      </div>

      <div>
        <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:6px;">Khổ giấy</label>
        <select style="width:100%;">
          <option>58mm</option>
          <option selected>80mm</option>
        </select>
      </div>

      <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface-1); border-radius:var(--radius);">
        <i class="ti ti-repeat" style="font-size:15px; color:var(--text-secondary);" aria-hidden="true"></i>
        <span style="font-size:13px; flex:1;">Tự động kết nối lại</span>
        <input type="checkbox" checked style="width:auto;" />
      </div>

    </div>

    <div style="display:flex; gap:8px; padding:14px 16px; border-top:0.5px solid var(--border);">
      <button style="flex:1;"><i class="ti ti-printer" style="font-size:14px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>In thử</button>
      <button style="flex:1; background:var(--fill-accent); color:var(--on-accent); border:none;">Lưu máy in</button>
    </div>

  </div>
</div>
